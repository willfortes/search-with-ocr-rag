services:
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: product-image-meili
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev_master_key_change_me}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-image-app
    restart: unless-stopped
    ports:
      - "3847:3847"
    environment:
      PORT: 3847
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev_master_key_change_me}
      MEILI_INDEX: product_images
      # Ollama no host (Windows/Mac). No Linux use IP da bridge ou service ollama.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    volumes:
      - ./downloads:/app/downloads
    depends_on:
      meilisearch:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Opcional: Ollama dentro do compose (pesado). Use: docker compose --profile ollama up -d
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: product-image-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  meili_data:
  ollama_data:
